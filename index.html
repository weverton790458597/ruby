<style>
:root{--black:#0a0708;--ink:#130c0e;--ruby:#c8102e;--ruby-deep:#7d0a1c;--white:#f7f3f2;--mute:#b7a9ab;--line:rgba(247,243,242,.16);--field:rgba(247,243,242,.06);--display:"Cormorant Garamond","Playfair Display",Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip;background:var(--black)}
body{background:var(--black);color:var(--white);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.5;padding-top:max(40px,calc(env(safe-area-inset-top,0px) + 28px));padding-bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 80px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;min-height:100dvh;transition:padding-right .3s ease;overflow-x:clip;position:relative}
body::before{content:"";position:absolute;top:-140px;left:50%;width:640px;height:640px;max-width:160vw;transform:translateX(-50%);background:radial-gradient(circle,rgba(200,16,46,.34) 0%,rgba(200,16,46,.08) 45%,transparent 70%);pointer-events:none}
.wrap{position:relative;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;transition:opacity .35s}
.wrap.is-loading{opacity:0}
.mono{width:112px;height:112px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--ruby),var(--white),var(--ruby-deep),var(--ruby));display:grid;place-items:center}
.mono>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#2a0f15,var(--black) 70%);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:600;font-size:58px;line-height:1;color:var(--white)}
.mono img{width:100%;height:100%;object-fit:cover;display:block}
.head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--ruby)}
h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(64px,20vw,88px);line-height:.9;letter-spacing:.02em;text-wrap:balance;overflow-wrap:anywhere}
h1 em{font-style:italic;color:var(--white)}
.tag{margin:0;color:var(--mute);max-width:32ch;text-wrap:balance}
.places{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--white)}
.places span+span::before{content:"◆";color:var(--ruby);margin-right:14px;font-size:7px;vertical-align:2px}
.stats{width:100%;display:grid;border-block:1px solid var(--line)}
.stats div{padding:14px 4px;text-align:center;min-width:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.links{width:100%;display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.link{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:17px 20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(247,243,242,.04),rgba(247,243,242,.01));color:var(--white);text-decoration:none;transition:background .25s,border-color .25s,transform .25s;min-height:68px}
a.link:hover,a.link:focus-visible{border-color:var(--ruby);background:rgba(200,16,46,.14);transform:translateY(-2px)}
.link:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.link .t{min-width:0}
.av{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2a0f15,var(--black) 75%);border:1px solid var(--line);color:var(--white)}
.av svg{width:22px;height:22px;fill:currentColor}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.link.feat .av{border-color:rgba(247,243,242,.5);background:var(--ruby-deep)}
.link strong{display:block;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.link span.s{display:block;font-size:12px;letter-spacing:.06em;color:var(--mute);margin-top:2px}
.link .arr{color:var(--ruby);font-size:18px}
.link.feat{background:var(--ruby);border-color:var(--ruby)}
.link.feat span.s{color:rgba(247,243,242,.82)}
.link.feat .arr{color:var(--white)}
a.link.feat:hover,a.link.feat:focus-visible{background:#e0152f;border-color:#e0152f}
.badge{display:inline-block;margin-bottom:4px;font-size:9.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;border:1px solid currentColor;padding:2px 8px}
.social{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.social a{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--white);transition:border-color .25s,background .25s}
.social a:hover,.social a:focus-visible{border-color:var(--ruby);background:var(--ruby)}
.social a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.social svg{width:19px;height:19px;fill:currentColor}
.foot{text-align:center;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute)}
.foot i{display:block;width:36px;height:1px;background:var(--ruby);margin:0 auto 14px}
.pencil{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(10,7,8,.7);border:1px solid var(--line);color:var(--mute);cursor:pointer;transition:background .25s,border-color .25s,color .25s}

.pencil:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.pencil svg{width:18px;height:18px;fill:currentColor}
.veil{position:fixed;inset:0;z-index:40;overflow-y:auto;display:grid;place-items:center;padding:16px;background:rgba(5,3,4,.82)}
.box{width:100%;max-width:360px;background:var(--ink);border:1px solid var(--line);padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px}
.box h2{margin:0;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1}
.box p{margin:0;color:var(--mute);font-size:13px}
.lbl{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.in{width:100%;min-width:0;font:inherit;font-size:16px;font-weight:300;letter-spacing:0;text-transform:none;color:var(--white);background:var(--field);border:1px solid var(--line);border-radius:0;padding:11px 12px}
textarea.in{resize:vertical;min-height:84px}
.in::placeholder{color:rgba(183,169,171,.6)}
.in:focus{outline:2px solid var(--ruby);outline-offset:0;border-color:var(--ruby)}
.btn{font:inherit;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--white);background:transparent;border:1px solid var(--line);padding:12px 18px;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover,.btn:focus-visible{border-color:var(--white)}
.btn:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.btn.pri{background:var(--ruby);border-color:var(--ruby)}
.btn.pri:hover,.btn.pri:focus-visible{background:#e0152f;border-color:#e0152f}
.btn.sm{padding:7px 10px;font-size:10.5px;letter-spacing:.14em}
.btn[disabled]{opacity:.5;cursor:default}
.msg{min-height:1.3em;margin:0;font-size:13px;color:var(--mute)}
.msg.err{color:#ff6b7f}
.row{display:flex;gap:10px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(460px,100%);height:100vh;height:100dvh;padding-right:env(safe-area-inset-right,0px);padding-left:env(safe-area-inset-left,0px);display:flex;flex-direction:column;background:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.dr-head,.dr-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--ink)}
.dr-head{padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.dr-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.dr-foot .msg{flex:1 1 100%;min-height:0}
.dr-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 18px 24px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.sec>h3{margin:0;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--ruby)}
.rowi{display:flex;gap:8px;align-items:flex-end}
.rowi .lbl{flex:1 1 0}
.rowi .btn{flex:none}
.ed-link{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ed-top b{font-family:var(--display);font-size:18px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--white)}
.chk input{width:18px;height:18px;accent-color:var(--ruby)}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.hint{margin:0;font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--white);color:var(--black);padding:10px 18px;max-width:calc(100% - 32px);text-align:center;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
a,button,label,input,textarea{touch-action:manipulation}
a.link:active{transform:scale(.985);background:rgba(200,16,46,.2)}
a.link.feat:active{background:#e0152f}
.social a:active,.pencil:active{transform:scale(.94)}

.pencil:hover{background:rgba(10,7,8,.7);border-color:var(--line);color:var(--mute)}
.pencil{width:48px;height:48px}.social a{width:50px;height:50px}
.btn.sm{min-height:40px;padding:8px 12px}.btn{min-height:44px}
.chk input{width:22px;height:22px}}
@media (max-width:420px){
body{font-size:14.5px}.wrap{gap:24px}
.mono{width:96px;height:96px}.mono>div{font-size:50px}
.eyebrow{letter-spacing:.26em}
.places{letter-spacing:.16em;gap:6px 10px}.places span+span::before{margin-right:10px}
.stats b{font-size:24px}.stats small{letter-spacing:.16em;font-size:9.5px}
.link{gap:10px;padding:14px}
.av{width:46px;height:46px}.av svg{width:20px;height:20px}
.link strong{font-size:20px}
.dr-head,.dr-foot,.dr-body{padding-left:14px;padding-right:14px}}
@media (max-width:340px){.link{grid-template-columns:auto 1fr}.link .arr{display:none}}
@media (max-width:600px){.drawer{width:100%;border-left:0;box-shadow:none}.dr-foot .btn{flex:1 1 0}}
@media (max-height:480px) and (orientation:landscape){

.mono{width:80px;height:80px}.mono>div{font-size:42px}h1{font-size:clamp(48px,12vw,64px)}}
@media (min-width:600px){
body{font-size:16px;padding-top:64px}.wrap{max-width:520px;gap:32px}
.mono{width:128px;height:128px}.mono>div{font-size:66px}
h1{font-size:96px}.tag{max-width:40ch;font-size:16px}
.eyebrow,.places{font-size:12px}
.stats b{font-size:32px}.stats div{padding:18px 6px}
.link{padding:20px 24px;gap:16px}
.av{width:58px;height:58px}.link strong{font-size:24px}.link span.s{font-size:13px}
.link .arr{transition:transform .25s}a.link:hover .arr{transform:translateX(4px)}}
@media (min-width:1024px){
body::before{top:-180px;width:900px;height:900px}body{padding-top:80px}
.wrap{max-width:560px}
body.editing{padding-right:calc(460px + 16px)}
body.editing::before{left:calc(50% - 230px)}
.drawer{width:460px}}
@media (prefers-reduced-motion:reduce){
.link,.wrap,.pencil,.social a,body,.btn,.link .arr{transition:none}
a.link:hover,a.link:active,.btn:active,.social a:active,.pencil:active{transform:none}
a.link:hover .arr{transform:none}}
</style>

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function has(s) { return String(s || '').trim() !== ''; }
  function safeUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^(https?:\/\/|#)/i.test(u)) return u;
    if (/^[\w-]+(\.[\w-]+)+(\/|$|\?)/i.test(u)) return 'https://' + u;
    return '';
  }
  function safeImg(u) {
    u = String(u || '').trim();
    return /^(data:image\/(png|jpe?g|webp|gif);base64,|https?:\/\/)/i.test(u) ? u : '';
  }
  function kind(url, text) {
    var h = String(url || '').toLowerCase();
    if (h.indexOf('tiktok.com') > -1) return 'tiktok';
    if (h.indexOf('instagram.com') > -1) return 'instagram';
    if (h.indexOf('wa.me') > -1 || h.indexOf('whatsapp.com') > -1) return 'whatsapp';
    if (h.indexOf('youtube.com') > -1 || h.indexOf('youtu.be') > -1) return 'youtube';
    var t = String(text || '').toLowerCase();
    if (/localiza|endere|mapa/.test(t)) return 'pin';
    if (/cat[aá]logo|modelo|valor/.test(t)) return 'star';
    return 'link';
  }
  function autoPhoto(url) {
    var h = String(url || ''), m;
    if ((m = h.match(/tiktok\.com\/@([^\/?#]+)/i))) return 'https://unavatar.io/tiktok/' + m[1] + '?fallback=false';
    if ((m = h.match(/instagram\.com\/([^\/?#]+)/i)) && !/^(p|reel|reels|stories|explore)$/i.test(m[1])) return 'https://unavatar.io/instagram/' + m[1] + '?fallback=false';
    if ((m = h.match(/youtube\.com\/@([^\/?#]+)/i))) return 'https://unavatar.io/youtube/' + m[1] + '?fallback=false';
    return '';
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function merge(saved) {
    var d = clone(DEFAULTS);
    if (!saved || typeof saved !== 'object') return d;
    ['avatar', 'eyebrow', 'name', 'tagline', 'footer'].forEach(function (k) {
      if (typeof saved[k] === 'string') d[k] = saved[k];
    });
    if (Array.isArray(saved.places)) d.places = saved.places.slice(0, LIMITS.places).map(String);
    if (Array.isArray(saved.stats)) d.stats = saved.stats.slice(0, LIMITS.stats).map(function (s) { s = s || {}; return { n: String(s.n || ''), l: String(s.l || '') }; });
    if (Array.isArray(saved.links)) d.links = saved.links.slice(0, LIMITS.links).map(function (l) {
      l = l || {};
      return { feat: !!l.feat, badge: String(l.badge || ''), title: String(l.title || ''), desc: String(l.desc || ''), url: String(l.url || ''), photo: String(l.photo || '') };
    });
    if (Array.isArray(saved.social)) {
      d.social = saved.social.slice(0, LIMITS.social).map(String);
    } else if (saved.social && typeof saved.social === 'object') {
      d.social = ['instagram', 'tiktok', 'youtube', 'whatsapp'].map(function (k) { return String(saved.social[k] || ''); }).filter(has);
    }
    return d;
  }
  function clean(d) {
    var c = clone(d);
    c.places = c.places.filter(has);
    c.stats = c.stats.filter(function (s) { return has(s.n) || has(s.l); });
    c.social = c.social.filter(has);
    c.links = c.links.filter(function (l) { return has(l.title) || has(l.url); });
    return c;
  }
  var state = clone(DEFAULTS);
  var saved = clone(DEFAULTS);
  function render() {
    var d = state, h = '';
    var hasAv = !!safeImg(d.avatar), hasName = has(d.name);
    var pl = d.places.filter(has);
    var st = d.stats.filter(function (s) { return has(s.n) || has(s.l); });
    var lk = d.links.map(function (l, i) { return { l: l, i: i }; }).filter(function (x) { return has(x.l.title) || has(x.l.url); });
    var so = d.social.filter(function (u) { return safeUrl(u); });
    if (hasAv || hasName || has(d.eyebrow) || has(d.tagline) || pl.length) {
      h += '<header class="head">';
      if (hasAv || hasName) {
        h += '<div class="mono"><div>' + (hasAv ? '<img src="' + esc(safeImg(d.avatar)) + '" alt="">' : esc(d.name.trim().charAt(0).toUpperCase())) + '</div></div>';
      }
      if (has(d.eyebrow)) h += '<span class="eyebrow">' + esc(d.eyebrow) + '</span>';
      if (hasName) h += '<h1><em>' + esc(d.name) + '</em></h1>';
      if (has(d.tagline)) h += '<p class="tag">' + esc(d.tagline) + '</p>';
      if (pl.length) h += '<div class="places">' + pl.map(function (p) { return '<span>' + esc(p) + '</span>'; }).join('') + '</div>';
      h += '</header>';
    }
    if (st.length) {
      h += '<section class="stats" aria-label="Números" style="grid-template-columns:repeat(' + st.length + ',minmax(0,1fr))">' +
        st.map(function (s) { return '<div>' + (has(s.n) ? '<b>' + esc(s.n) + '</b>' : '') + (has(s.l) ? '<small>' + esc(s.l) + '</small>' : '') + '</div>'; }).join('') + '</section>';
    }
    if (lk.length) {
      h += '<ul class="links">' + lk.map(function (x) {
        var l = x.l, url = safeUrl(l.url), tag = url ? 'a' : 'div';
        return '<li><' + tag + ' class="link' + (l.feat ? ' feat' : '') + '"' +
          (url ? ' href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' : '') + ' data-i="' + x.i + '">' +
          '<span class="av" aria-hidden="true"></span>' +
          '<span class="t">' + (l.feat && has(l.badge) ? '<span class="badge">' + esc(l.badge) + '</span>' : '') +
          (has(l.title) ? '<strong>' + esc(l.title) + '</strong>' : '') +
          (has(l.desc) ? '<span class="s">' + esc(l.desc) + '</span>' : '') + '</span>' +
          (url ? '<span class="arr">→</span>' : '<span></span>') + '</' + tag + '></li>';
      }).join('') + '</ul>';
    }
    if (so.length) {
      h += '<nav class="social" aria-label="Redes sociais">' + so.map(function (u) {
        var k = kind(u);
        return '<a href="' + esc(safeUrl(u)) + '" target="_blank" rel="noopener noreferrer" aria-label="' + NAMES[k] + '"><svg viewBox="0 0 24 24">' + ICONS[k] + '</svg></a>';
      }).join('') + '</nav>';
    }
    if (has(d.footer)) h += '<footer class="foot"><i></i>' + esc(d.footer) + '</footer>';
    $('app').innerHTML = h;
    fillAvatars();
  }
  function fillAvatars() {
    var as = $('app').querySelectorAll('.link');
    for (var n = 0; n < as.length; n++) (function (a) {
      var l = state.links[+a.getAttribute('data-i')];
      var av = a.querySelector('.av');
      var icon = '<svg viewBox="0 0 24 24">' + ICONS[kind(l.url, l.title)] + '</svg>';
      var photo = safeImg(l.photo) || autoPhoto(l.url);
      if (!photo) { av.innerHTML = icon; return; }
      var img = new Image();
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.onerror = function () { av.innerHTML = icon; };
      img.src = photo;
      av.appendChild(img);
    })(as[n]);
  }
  function sb(path, opts) {
    opts = opts || {};
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
    return fetch(SB_URL + path, {
      method: opts.method || 'GET',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  function load() {
    var done = false;
    function reveal() { if (!done) { done = true; $('app').classList.remove('is-loading'); } }
    setTimeout(reveal, 900);
    render();
    sb('/rest/v1/bio_page?id=eq.' + PAGE_ID + '&select=data').then(function (rows) {
      var data = rows && rows[0] && rows[0].data;
      if (data && Object.keys(data).length) {
        saved = merge(data);
        state = clone(saved);
        render();
      }
      reveal();
    }).catch(reveal);
  }
  var password = '';
  var lastFocus = null;
  var mode = 'login';
  function setMode(m) {
    mode = m;
    var create = m === 'create';
    $('loginTitle').textContent = create ? 'Crie sua senha' : 'Área de edição';
    $('loginHint').textContent = create
      ? 'Primeiro acesso: escolha uma senha (mínimo 8 caracteres). Guarde bem, ela será pedida sempre que for editar.'
      : 'Digite a senha para editar a página.';
    $('loginGo').textContent = create ? 'Criar senha' : 'Entrar';
    $('pw').setAttribute('autocomplete', create ? 'new-password' : 'current-password');
    $('pw2Wrap').hidden = !create;
    $('pw2').required = create;
  }
  function openLogin() {
    lastFocus = document.activeElement;
    $('loginMsg').textContent = '';
    $('loginMsg').className = 'msg';
    $('pw').value = '';
    $('pw2').value = '';
    $('login').hidden = false;
    $('pw').focus();
  }
  function closeLogin() {
    $('login').hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('pencil').addEventListener('click', function () {
    if (password) { openEditor(); return; }
    var btn = $('pencil');
    btn.disabled = true;
    sb('/rest/v1/rpc/tem_senha', { method: 'POST', body: { p_id: PAGE_ID } }).then(function (hasPw) {
      btn.disabled = false;
      setMode(hasPw === true ? 'login' : 'create');
      openLogin();
    }).catch(function () {
      btn.disabled = false;
      toast('Não foi possível conectar. Tente de novo.');
    });
  });
  $('loginCancel').addEventListener('click', closeLogin);
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    var msg = $('loginMsg'), go = $('loginGo');
    function fail(t) { go.disabled = false; msg.className = 'msg err'; msg.textContent = t; }
    function enter() { go.disabled = false; password = pw; $('login').hidden = true; openEditor(); }
    msg.className = 'msg';
    if (mode === 'create') {
      if (pw.length < 8) { fail('A senha precisa ter pelo menos 8 caracteres.'); return; }
      if (pw !== $('pw2').value) { fail('As senhas não são iguais.'); return; }
      go.disabled = true;
      msg.textContent = 'Criando...';
      sb('/rest/v1/rpc/criar_senha', { method: 'POST', body: { p_id: PAGE_ID, p_senha: pw } }).then(function (ok) {
        if (ok === true) { enter(); toast('Senha criada'); }
        else { setMode('login'); fail('Essa página já tem senha. Digite a senha para entrar.'); }
      }).catch(function () { fail('Não foi possível conectar. Tente de novo.'); });
      return;
    }
    go.disabled = true;
    msg.textContent = 'Conferindo...';
    sb('/rest/v1/rpc/verificar_senha', { method: 'POST', body: { p_id: PAGE_ID, p_senha: pw } }).then(function (ok) {
      if (ok === true) { enter(); }
      else { fail('Senha incorreta.'); $('pw').select(); }
    }).catch(function () { fail('Não foi possível conectar. Tente de novo.'); });
  });
  var draft = null;
  var previewTimer = null;
  var URLX = ' inputmode="url" autocapitalize="off"';
  function field(label, key, value, ph, extra) {
    return '<label class="lbl">' + label + '<input class="in" type="text" data-k="' + key + '" value="' + esc(value) + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + (extra || '') + '></label>';
  }
  function delBtn(list, i) {
    return '<button class="btn sm" type="button" data-act="del" data-list="' + list + '" data-i="' + i + '" aria-label="Remover">✕</button>';
  }
  function addBtn(list, label) {
    return '<div><button class="btn" type="button" data-act="add" data-list="' + list + '"' +
      (draft[list].length >= LIMITS[list] ? ' disabled' : '') + '>+ ' + label + '</button></div>';
  }
  function photoBlock(path, photo, auto) {
    var p = safeImg(photo);
    return '<div class="ph"><div class="thumb">' + (p ? '<img src="' + esc(p) + '" alt="">' : (auto ? 'auto' : 'sem foto')) + '</div>' +
      '<input type="file" accept="image/*" data-photo="' + path + '" aria-label="Enviar foto">' +
      (p ? '<button class="btn sm" type="button" data-act="rmphoto" data-path="' + path + '">Remover foto</button>' : '') + '</div>';
  }
  function editorHtml() {
    var d = draft, h = '';
    h += '<section class="sec"><h3>Perfil</h3><p class="hint">Campos vazios não aparecem na página.</p>' +
      '<div><span class="lbl" style="margin-bottom:8px">Foto principal</span>' + photoBlock('avatar', d.avatar, false) + '</div>' +
      field('Categoria', 'eyebrow', d.eyebrow, 'Ex.: Lifestyle') +
      field('Nome', 'name', d.name, 'Seu nome') +
      '<label class="lbl">Descrição<textarea class="in" rows="3" data-k="tagline" placeholder="Uma frase sobre você">' + esc(d.tagline) + '</textarea></label></section>';
    h += '<section class="sec"><h3>Cidades</h3>' +
      d.places.map(function (p, i) { return '<div class="rowi">' + field('Cidade ' + (i + 1), 'places.' + i, p) + delBtn('places', i) + '</div>'; }).join('') +
      addBtn('places', 'Adicionar cidade') + '</section>';
    h += '<section class="sec"><h3>Números</h3>' +
      d.stats.map(function (s, i) {
        return '<div class="rowi">' + field('Número', 'stats.' + i + '.n', s.n) + field('Legenda', 'stats.' + i + '.l', s.l) + delBtn('stats', i) + '</div>';
      }).join('') + addBtn('stats', 'Adicionar número') + '</section>';
    h += '<section class="sec"><h3>Links</h3><p class="hint">Sem foto enviada, a página busca a foto do perfil pelo @ do link do TikTok, Instagram ou YouTube.</p>' +
      d.links.map(function (l, i) {
        var k = 'links.' + i + '.';
        return '<div class="ed-link"><div class="ed-top"><b>Link ' + (i + 1) + '</b><div class="row">' +
          '<button class="btn sm" type="button" data-act="up" data-list="links" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir">↑</button>' +
          '<button class="btn sm" type="button" data-act="down" data-list="links" data-i="' + i + '"' + (i === d.links.length - 1 ? ' disabled' : '') + ' aria-label="Descer">↓</button>' +
          '<button class="btn sm" type="button" data-act="del" data-list="links" data-i="' + i + '">Remover</button></div></div>' +
          field('Título', k + 'title', l.title, 'Nome do botão') +
          field('Descrição (opcional)', k + 'desc', l.desc) +
          field('Endereço do link', k + 'url', l.url, 'https://...', URLX) +
          '<label class="chk"><input type="checkbox" data-k="' + k + 'feat"' + (l.feat ? ' checked' : '') + '> Destacar em vermelho</label>' +
          (l.feat ? field('Selo do destaque', k + 'badge', l.badge, 'Ex.: Novo') : '') +
          photoBlock('links.' + i, l.photo, !!autoPhoto(l.url)) + '</div>';
      }).join('') + addBtn('links', 'Adicionar link') + '</section>';
    h += '<section class="sec"><h3>Redes sociais</h3><p class="hint">O ícone é escolhido pelo endereço (Instagram, TikTok, YouTube, WhatsApp).</p>' +
      d.social.map(function (u, i) { return '<div class="rowi">' + field('Rede ' + (i + 1), 'social.' + i, u, 'https://...', URLX) + delBtn('social', i) + '</div>'; }).join('') +
      addBtn('social', 'Adicionar rede') + '</section>';
    h += '<section class="sec"><h3>Rodapé</h3>' + field('Texto', 'footer', d.footer, 'Opcional') + '</section>';
    return h;
  }
  function paintEditor() {
    var body = $('drBody'), top = body.scrollTop;
    body.innerHTML = editorHtml();
    body.scrollTop = top;
  }
  function openEditor() {
    draft = clone(state);
    paintEditor();
    $('saveMsg').textContent = '';
    $('saveMsg').className = 'msg';
    $('drawer').hidden = false;
    $('pencil').hidden = true;
    document.body.classList.add('editing');
  }
  function closeEditor(revert) {
    if (revert) { state = clone(saved); render(); }
    $('drawer').hidden = true;
    $('pencil').hidden = false;
    document.body.classList.remove('editing');
  }
  function setPath(o, path, v) {
    var p = path.split('.');
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = v;
  }
  function preview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { state = clone(draft); render(); }, 250);
  }
  function resizeImage(file, size, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = c.height = size;
        var s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { cb(''); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(''); };
    fr.readAsDataURL(file);
  }
  var body = $('drBody');
  body.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k || e.target.type === 'checkbox') return;
    setPath(draft, k, e.target.value);
    preview();
  });
  body.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (k && t.type === 'checkbox') {
      setPath(draft, k, t.checked);
      paintEditor();
      state = clone(draft); render();
      return;
    }
    var ph = t.getAttribute('data-photo');
    if (ph && t.files && t.files[0]) {
      resizeImage(t.files[0], 256, function (data) {
        if (!data) { $('saveMsg').className = 'msg err'; $('saveMsg').textContent = 'Não foi possível ler essa imagem.'; return; }
        if (ph === 'avatar') draft.avatar = data; else setPath(draft, ph + '.photo', data);
        paintEditor();
        state = clone(draft); render();
      });
    }
  });
  var NEW = {
    places: function () { return ''; },
    stats: function () { return { n: '', l: '' }; },
    social: function () { return ''; },
    links: function () { return { feat: false, badge: '', title: '', desc: '', url: '', photo: '' }; }
  };
  function onAct(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), list = b.getAttribute('data-list'), i = +b.getAttribute('data-i');
    if (act === 'close') { closeEditor(true); return; }
    var a = list ? draft[list] : null;
    if (act === 'add' && a && a.length < LIMITS[list]) { a.push(NEW[list]()); }
    else if (act === 'del' && a) { a.splice(i, 1); }
    else if (act === 'up' && a && i > 0) { a.splice(i - 1, 0, a.splice(i, 1)[0]); }
    else if (act === 'down' && a && i < a.length - 1) { a.splice(i + 1, 0, a.splice(i, 1)[0]); }
    else if (act === 'rmphoto') {
      var p = b.getAttribute('data-path');
      if (p === 'avatar') draft.avatar = ''; else setPath(draft, p + '.photo', '');
    } else { return; }
    paintEditor();
    state = clone(draft); render();
    if (act === 'add') {
      var ins = $('drBody').querySelectorAll('[data-k^="' + list + '."]');
      var last = ins.length ? ins[ins.length - 1] : null;
      if (list === 'stats' || list === 'links') {
        var f = $('drBody').querySelector('[data-k="' + list + '.' + (a.length - 1) + '.' + (list === 'stats' ? 'n' : 'title') + '"]');
        if (f) f.focus();
      } else if (last && list !== 'links') { last.focus(); }
    }
  }
  $('drawer').addEventListener('click', onAct);
  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.hidden = false;
    setTimeout(function () { el.hidden = true; }, 2200);
  }
  $('save').addEventListener('click', function () {
    var btn = $('save'), msg = $('saveMsg');
    clearTimeout(previewTimer);
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Salvando...';
    var data = clean(draft);
    sb('/rest/v1/rpc/salvar_bio', { method: 'POST', body: { p_id: PAGE_ID, p_senha: password, p_dados: data } }).then(function (ok) {
      btn.disabled = false;
      if (ok === true) {
        saved = merge(data);
        state = clone(saved);
        render();
        msg.textContent = '';
        closeEditor(false);
        toast('Salvo');
      } else {
        password = '';
        msg.className = 'msg err';
        msg.textContent = 'Senha não aceita. Feche e entre de novo.';
      }
    }).catch(function () {
      btn.disabled = false;
      msg.className = 'msg err';
      msg.textContent = 'Não foi possível salvar. Confira a conexão e a configuração do Supabase.';
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('login').hidden) closeLogin();
    else if (!$('drawer').hidden) closeEditor(true);
  });
  load();
})();
</script>
</body>
</html>
