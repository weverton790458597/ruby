/* Layout: single centered column, black stage with a red glow behind the monogram, links as wide ruled bars.

:root {

  --ink: #130c0e;

* { box-sizing: border-box; }
html { background: var(--black); }
body {

  color: var(--white);
  font-family: var(--body);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.5;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: absolute;
  top: -140px; left: 50%;
  width: 640px; height: 640px; max-width: 160vw;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(200, 16, 46, 0.34) 0%, rgba(200, 16, 46, 0.08) 45%, transparent 70%);
  pointer-events: none;
}
.wrap {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  transition: opacity .35s;
}
.wrap.is-loading { opacity: 0; }

/* Header */
.mono {
  width: 112px; height: 112px;
  border-radius: 50%;

}
.mono > div {
  width: 100%; height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #2a0f15, var(--black) 70%);
  display: grid; place-items: center;
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 58px;
  line-height: 1;
  color: var(--white);
}
.mono img { width: 100%; height: 100%; object-fit: cover; display: block; }
.head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

h1 {

  font-weight: 500;
  font-size: clamp(64px, 20vw, 88px);

}
h1 em { font-style: italic; color: var(--white); }
.tag { margin: 0; color: var(--mute); max-width: 32ch; text-wrap: balance; }
.places {

}
.places span + span::before { content: "◆"; color: var(--ruby); margin-right: 14px; font-size: 7px; vertical-align: 2px; }

/* Stats */
.stats {
  width: 100%;
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-block: 1px solid var(--line);
}
.stats div { padding: 14px 4px; text-align: center; min-width: 0; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b {

  font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1;

}
.stats small { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute); }

/* Links */
.links { width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.link {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 17px 20px;
  border: 1px solid var(--line);

.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.link.feat .av { border-color: rgba(247,243,242,0.5); background: var(--ruby-deep); }

.link.feat:hover, .link.feat:focus-visible { background: #e0152f; border-color: #e0152f; }
.badge {
  display: inline-block; margin-bottom: 4px;
  font-size: 9.5px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase;

.social { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.social a {

  color: var(--white);

}
.social a:hover, .social a:focus-visible { border-color: var(--ruby); background: var(--ruby); }
.social a:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.social svg { width: 19px; height: 19px; fill: currentColor; }

.foot { text-align: center; font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--mute); }
.foot i { display: block; width: 36px; height: 1px; background: var(--ruby); margin: 0 auto 14px; }

.pencil {

  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 20;

  display: grid; place-items: center;
  background: rgba(10, 7, 8, 0.7);
  border: 1px solid var(--line);
  color: var(--mute);
  cursor: pointer;
  transition: background .25s, border-color .25s, color .25s;
}
.pencil:hover, .pencil:focus-visible { background: var(--ruby); border-color: var(--ruby); color: var(--white); }
.pencil:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.pencil svg { width: 18px; height: 18px; fill: currentColor; }

/* Janela da senha */
.veil {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(5, 3, 4, 0.82);

.box {
  width: 100%; max-width: 360px;
  background: var(--ink);
  border: 1px solid var(--line);
  padding: 28px 24px 24px;
  display: flex; flex-direction: column; gap: 14px;

.box h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; }
.box p { margin: 0; color: var(--mute); font-size: 13px; }

/* Formulários */
.lbl { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); }
.in {

.btn {

.toast {

  background: var(--white); color: var(--black);
  padding: 10px 18px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;

@media (prefers-reduced-motion: reduce) {
  .link, .wrap, .pencil, .social a { transition: none; }
  .link:hover { transform: none; }
}

    if (h.indexOf('tiktok.com') > -1) return 'tiktok';
    if (h.indexOf('instagram.com') > -1) return 'instagram';
    if (h.indexOf('wa.me') > -1 || h.indexOf('whatsapp.com') > -1) return 'whatsapp';
    if (h.indexOf('youtube.com') > -1 || h.indexOf('youtu.be') > -1) return 'youtube';
    var t = String(text || '').toLowerCase();
    if (/localiza|endere|mapa/.test(t)) return 'pin';
    if (/cat[aá]logo|modelo|valor/.test(t)) return 'star';
    return 'link';
  }
  /* Foto de perfil automática pelo @ do link (serviço público unavatar.io). Se falhar, fica o ícone. */
  function autoPhoto(url) {
    var h = String(url || ''), m;
    if ((m = h.match(/tiktok\.com\/@([^\/?#]+)/i))) return 'https://unavatar.io/tiktok/' + m[1] + '?fallback=false';
    if ((m = h.match(/instagram\.com\/([^\/?#]+)/i)) && !/^(p|reel|reels|stories|explore)$/i.test(m[1])) return 'https://unavatar.io/instagram/' + m[1] + '?fallback=false';
    if ((m = h.match(/youtube\.com\/@([^\/?#]+)/i))) return 'https://unavatar.io/youtube/' + m[1] + '?fallback=false';
    return '';
  }
  function merge(saved) {
    var d = clone(DEFAULTS);
    if (!saved || typeof saved !== 'object') return d;
    ['avatar', 'eyebrow', 'name', 'tagline', 'footer'].forEach(function (k) {
      if (typeof saved[k] === 'string') d[k] = saved[k];
    });
    if (Array.isArray(saved.places)) d.places = [0, 1, 2].map(function (i) { return String(saved.places[i] || ''); });
    if (Array.isArray(saved.stats)) d.stats = [0, 1, 2].map(function (i) { var s = saved.stats[i] || {}; return { n: String(s.n || ''), l: String(s.l || '') }; });
    if (Array.isArray(saved.links)) d.links = saved.links.slice(0, 20).map(function (l) {
      l = l || {};
      return { feat: !!l.feat, badge: String(l.badge || ''), title: String(l.title || ''), desc: String(l.desc || ''), url: String(l.url || ''), photo: String(l.photo || '') };
    });
    if (saved.social && typeof saved.social === 'object') {
      ['instagram', 'tiktok', 'youtube', 'whatsapp'].forEach(function (k) { d.social[k] = String(saved.social[k] || ''); });
    }
    return d;
  }

  /* ---------- Página ---------- */
  var state = clone(DEFAULTS);
  var saved = clone(DEFAULTS);

  function render() {
    var d = state, h = '';
    var av = safeImg(d.avatar)
      ? '<img src="' + esc(safeImg(d.avatar)) + '" alt="">'
      : esc((String(d.name || 'R').trim().charAt(0) || 'R').toUpperCase());
    h += '<header class="head"><div class="mono"><div>' + av + '</div></div>';
    if (d.eyebrow.trim()) h += '<span class="eyebrow">' + esc(d.eyebrow) + '</span>';
    if (d.name.trim()) h += '<h1><em>' + esc(d.name) + '</em></h1>';
    if (d.tagline.trim()) h += '<p class="tag">' + esc(d.tagline) + '</p>';
    var pl = d.places.filter(function (p) { return p.trim(); });
    if (pl.length) h += '<div class="places">' + pl.map(function (p) { return '<span>' + esc(p) + '</span>'; }).join('') + '</div>';
    h += '</header>';

    var st = d.stats.filter(function (s) { return s.n.trim() || s.l.trim(); });
    if (st.length) {
      h += '<section class="stats" aria-label="Números" style="grid-template-columns:repeat(' + st.length + ',1fr)">' +
        st.map(function (s) { return '<div><b>' + esc(s.n) + '</b><small>' + esc(s.l) + '</small></div>'; }).join('') + '</section>';
    }

    if (d.links.length) {
      h += '<ul class="links">' + d.links.map(function (l, i) {
        var url = safeUrl(l.url);
        return '<li><a class="link' + (l.feat ? ' feat' : '') + '" href="' + esc(url || '#') + '"' +
          (url ? ' target="_blank" rel="noopener noreferrer"' : '') + ' data-i="' + i + '">' +
          '<span class="av" aria-hidden="true"></span>' +
          '<span class="t">' + (l.feat && l.badge.trim() ? '<span class="badge">' + esc(l.badge) + '</span>' : '') +
          '<strong>' + esc(l.title) + '</strong>' +
          (l.desc.trim() ? '<span class="s">' + esc(l.desc) + '</span>' : '') + '</span>' +
          '<span class="arr">→</span></a></li>';
      }).join('') + '</ul>';
    }

    var so = ['instagram', 'tiktok', 'youtube', 'whatsapp'].filter(function (k) { return safeUrl(d.social[k]); });
    if (so.length) {
      h += '<nav class="social" aria-label="Redes sociais">' + so.map(function (k) {
        return '<a href="' + esc(safeUrl(d.social[k])) + '" target="_blank" rel="noopener noreferrer" aria-label="' + k.charAt(0).toUpperCase() + k.slice(1) + '"><svg viewBox="0 0 24 24">' + ICONS[k] + '</svg></a>';
      }).join('') + '</nav>';
    }
    if (d.footer.trim()) h += '<footer class="foot"><i></i>' + esc(d.footer) + '</footer>';

    $('app').innerHTML = h;
    fillAvatars();
  }

  function fillAvatars() {
    var as = $('app').querySelectorAll('a.link');
    for (var n = 0; n < as.length; n++) (function (a) {
      var l = state.links[+a.getAttribute('data-i')];
      var av = a.querySelector('.av');
      var icon = '<svg viewBox="0 0 24 24">' + ICONS[kind(l.url, l.title)] + '</svg>';
      var photo = safeImg(l.photo) || autoPhoto(l.url);
      if (!photo) { av.innerHTML = icon; return; }
      var img = new Image();
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.onerror = function () { av.innerHTML = icon; };
      img.src = photo;
      av.appendChild(img);
    })(as[n]);
  }

  /* ---------- Supabase ---------- */
  function sb(path, opts) {
    opts = opts || {};
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
    return fetch(SB_URL + path, {
      method: opts.method || 'GET',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }

  function load() {
    var done = false;
    function reveal() { if (!done) { done = true; $('app').classList.remove('is-loading'); } }
    setTimeout(reveal, 900);
    render();
    sb('/rest/v1/bio_page?id=eq.' + PAGE_ID + '&select=data').then(function (rows) {
      var data = rows && rows[0] && rows[0].data;
      if (data && Object.keys(data).length) {
        saved = merge(data);
        state = clone(saved);
        render();
      }
      reveal();
    }).catch(reveal);
  }

  /* ---------- Senha ---------- */
  var password = '';
  var lastFocus = null;

  var mode = 'login'; /* 'login' | 'create' */

  function setMode(m) {
    mode = m;
    var create = m === 'create';
    $('loginTitle').textContent = create ? 'Crie sua senha' : 'Área de edição';
    $('loginHint').textContent = create
      ? 'Primeiro acesso: escolha uma senha (mínimo 8 caracteres). Guarde bem, ela será pedida sempre que for editar.'
      : 'Digite a senha para editar a página.';
    $('loginGo').textContent = create ? 'Criar senha' : 'Entrar';
    $('pw').setAttribute('autocomplete', create ? 'new-password' : 'current-password');
    $('pw2Wrap').hidden = !create;
    $('pw2').required = create;
  }

  function openLogin() {
    lastFocus = document.activeElement;
    $('loginMsg').textContent = '';
    $('loginMsg').className = 'msg';
    $('pw').value = '';
    $('pw2').value = '';
    $('login').hidden = false;
    $('pw').focus();
  }
  function closeLogin() {
    $('login').hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $('pencil').addEventListener('click', function () {
    if (password) { openEditor(); return; }
    var btn = $('pencil');
    btn.disabled = true;
    sb('/rest/v1/rpc/tem_senha', { method: 'POST', body: { p_id: PAGE_ID } }).then(function (has) {
      btn.disabled = false;
      setMode(has === true ? 'login' : 'create');
      openLogin();
    }).catch(function () {
      btn.disabled = false;
      toast('Não foi possível conectar. Tente de novo.');
    });
  });
  $('loginCancel').addEventListener('click', closeLogin);
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    var msg = $('loginMsg'), go = $('loginGo');
    function fail(t) { go.disabled = false; msg.className = 'msg err'; msg.textContent = t; }
    function enter() { go.disabled = false; password = pw; $('login').hidden = true; openEditor(); }
    msg.className = 'msg';

    if (mode === 'create') {
      if (pw.length < 8) { fail('A senha precisa ter pelo menos 8 caracteres.'); return; }
      if (pw !== $('pw2').value) { fail('As senhas não são iguais.'); return; }
      go.disabled = true;
      msg.textContent = 'Criando...';
      sb('/rest/v1/rpc/criar_senha', { method: 'POST', body: { p_id: PAGE_ID, p_senha: pw } }).then(function (ok) {
        if (ok === true) { enter(); toast('Senha criada'); }
        else { setMode('login'); fail('Essa página já tem senha. Digite a senha para entrar.'); }
      }).catch(function () { fail('Não foi possível conectar. Tente de novo.'); });
      return;
    }

    go.disabled = true;
    msg.textContent = 'Conferindo...';
    sb('/rest/v1/rpc/verificar_senha', { method: 'POST', body: { p_id: PAGE_ID, p_senha: pw } }).then(function (ok) {
      if (ok === true) { enter(); }
      else { fail('Senha incorreta.'); $('pw').select(); }
    }).catch(function () { fail('Não foi possível conectar. Tente de novo.'); });
  });

  /* ---------- Editor ---------- */
  var draft = null;
  var previewTimer = null;

  function field(label, key, value, ph, extra) {
    return '<label class="lbl">' + label + '<input class="in" type="text" data-k="' + key + '" value="' + esc(value) + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + (extra || '') + '></label>';
  }
  function photoBlock(path, photo, auto) {
    var p = safeImg(photo);
    return '<div class="ph"><div class="thumb">' + (p ? '<img src="' + esc(p) + '" alt="">' : (auto ? 'auto' : 'sem foto')) + '</div>' +
      '<input type="file" accept="image/*" data-photo="' + path + '" aria-label="Enviar foto">' +
      (p ? '<button class="btn sm" type="button" data-act="rmphoto" data-path="' + path + '">Remover foto</button>' : '') + '</div>';
  }

  function editorHtml() {
    var d = draft, h = '';
    h += '<section class="sec"><h3>Perfil</h3>' +
      '<div><span class="lbl" style="margin-bottom:8px">Foto principal</span>' + photoBlock('avatar', d.avatar, false) + '</div>' +
      field('Categoria', 'eyebrow', d.eyebrow, 'Ex.: Lifestyle') +
      field('Nome', 'name', d.name, 'Seu nome') +
      '<label class="lbl">Descrição<textarea class="in" rows="3" data-k="tagline" placeholder="Uma frase sobre você">' + esc(d.tagline) + '</textarea></label>' +
      '<div class="grid3">' + d.places.map(function (p, i) { return field('Cidade ' + (i + 1), 'places.' + i, p); }).join('') + '</div></section>';

    h += '<section class="sec"><h3>Números</h3><p class="hint">Deixe vazio para esconder.</p>' +
      d.stats.map(function (s, i) {
        return '<div class="grid2">' + field('Número', 'stats.' + i + '.n', s.n) + field('Legenda', 'stats.' + i + '.l', s.l) + '</div>';
      }).join('') + '</section>';

    h += '<section class="sec"><h3>Links</h3><p class="hint">Sem foto enviada, a página busca a foto do perfil pelo @ do link do TikTok, Instagram ou YouTube.</p>' +
      d.links.map(function (l, i) {
        var k = 'links.' + i + '.';
        return '<div class="ed-link"><div class="ed-top"><b>Link ' + (i + 1) + '</b><div class="row">' +
          '<button class="btn sm" type="button" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir">↑</button>' +
          '<button class="btn sm" type="button" data-act="down" data-i="' + i + '"' + (i === d.links.length - 1 ? ' disabled' : '') + ' aria-label="Descer">↓</button>' +
          '<button class="btn sm" type="button" data-act="del" data-i="' + i + '">Remover</button></div></div>' +
          field('Título', k + 'title', l.title) +
          field('Descrição', k + 'desc', l.desc) +
          field('Endereço do link', k + 'url', l.url, 'https://...', ' inputmode="url" autocapitalize="off"') +
          '<label class="chk"><input type="checkbox" data-k="' + k + 'feat"' + (l.feat ? ' checked' : '') + '> Destacar em vermelho</label>' +
          (l.feat ? field('Selo do destaque', k + 'badge', l.badge, 'Ex.: Novo') : '') +
          photoBlock('links.' + i, l.photo, !!autoPhoto(l.url)) + '</div>';
      }).join('') +
      '<div><button class="btn" type="button" data-act="add"' + (d.links.length >= 20 ? ' disabled' : '') + '>+ Adicionar link</button></div></section>';

    h += '<section class="sec"><h3>Redes sociais</h3><p class="hint">Deixe vazio para esconder o ícone.</p>' +
      field('Instagram', 'social.instagram', d.social.instagram, 'https://instagram.com/...', ' inputmode="url" autocapitalize="off"') +
      field('TikTok', 'social.tiktok', d.social.tiktok, 'https://tiktok.com/@...', ' inputmode="url" autocapitalize="off"') +
      field('YouTube', 'social.youtube', d.social.youtube, 'https://youtube.com/@...', ' inputmode="url" autocapitalize="off"') +
      field('WhatsApp', 'social.whatsapp', d.social.whatsapp, 'https://wa.me/55...', ' inputmode="url" autocapitalize="off"') + '</section>';

    h += '<section class="sec"><h3>Rodapé</h3>' + field('Texto', 'footer', d.footer) + '</section>';
    return h;
  }

  function paintEditor() {
    var body = $('drBody'), top = body.scrollTop;
    body.innerHTML = editorHtml();
    body.scrollTop = top;
  }
  function openEditor() {
    draft = clone(state);
    paintEditor();
    $('saveMsg').textContent = '';
    $('saveMsg').className = 'msg';
    $('drawer').hidden = false;
    $('pencil').hidden = true;
  }
  function closeEditor(revert) {
    if (revert) { state = clone(saved); render(); }
    $('drawer').hidden = true;
    $('pencil').hidden = false;
  }
  function setPath(o, path, v) {
    var p = path.split('.');
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = v;
  }
  function getPath(o, path) {
    var p = path.split('.');
    for (var i = 0; i < p.length; i++) o = o[p[i]];
    return o;
  }
  function preview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { state = clone(draft); render(); }, 250);
  }
  function resizeImage(file, size, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = c.height = size;
        var s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { cb(''); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(''); };
    fr.readAsDataURL(file);
  }

  var body = $('drBody');
  body.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k || e.target.type === 'checkbox') return;
    setPath(draft, k, e.target.value);
    preview();
  });
  body.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (k && t.type === 'checkbox') {
      setPath(draft, k, t.checked);
      paintEditor();
      state = clone(draft); render();
      return;
    }
    var ph = t.getAttribute('data-photo');
    if (ph && t.files && t.files[0]) {
      resizeImage(t.files[0], 256, function (data) {
        if (!data) { $('saveMsg').className = 'msg err'; $('saveMsg').textContent = 'Não foi possível ler essa imagem.'; return; }
        if (ph === 'avatar') draft.avatar = data; else setPath(draft, ph + '.photo', data);
        paintEditor();
        state = clone(draft); render();
      });
    }
  });
  function onAct(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    if (act === 'close') { closeEditor(true); return; }
    if (act === 'add') { draft.links.push({ feat: false, badge: '', title: 'Novo link', desc: '', url: '', photo: '' }); }
    else if (act === 'del') { draft.links.splice(i, 1); }
    else if (act === 'up' && i > 0) { draft.links.splice(i - 1, 0, draft.links.splice(i, 1)[0]); }
    else if (act === 'down' && i < draft.links.length - 1) { draft.links.splice(i + 1, 0, draft.links.splice(i, 1)[0]); }
    else if (act === 'rmphoto') {
      var p = b.getAttribute('data-path');
      if (p === 'avatar') draft.avatar = ''; else setPath(draft, p + '.photo', '');
    } else { return; }
    paintEditor();
    state = clone(draft); render();
  }
  $('drawer').addEventListener('click', onAct);

  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.hidden = false;
    setTimeout(function () { el.hidden = true; }, 2200);
  }

  $('save').addEventListener('click', function () {
    var btn = $('save'), msg = $('saveMsg');
    clearTimeout(previewTimer);
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Salvando...';
    var data = clone(draft);
    sb('/rest/v1/rpc/salvar_bio', { method: 'POST', body: { p_id: PAGE_ID, p_senha: password, p_dados: data } }).then(function (ok) {
      btn.disabled = false;
      if (ok === true) {
        saved = merge(data);
        state = clone(saved);
        render();
        msg.textContent = '';
        closeEditor(false);
        toast('Salvo');
      } else {
        password = '';
        msg.className = 'msg err';
        msg.textContent = 'Senha não aceita. Feche e entre de novo.';
      }
    }).catch(function () {
      btn.disabled = false;
      msg.className = 'msg err';
      msg.textContent = 'Não foi possível salvar. Confira a conexão e a configuração do Supabase.';
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('login').hidden) closeLogin();
    else if (!$('drawer').hidden) closeEditor(true);
  });

  load();
})();
</script>

</body></html>
